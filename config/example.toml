[[exec-once]]
command = "waybar"

[general]

[general.appearance]
inner_gaps = 3
outer_gaps = 5
border_width = 3

[general.binds]
interactive_modifier = "Super"

[[keybind]]
keys = "Super+Return"
action = "spawn"
args = "kitty"

[[keybind]]
keys = "Super+Q"
action = "close"

[[keybind]]
keys = "Super+Space"
action = "spawn"
args = "rofi -show drun"

[[keybind]]
keys = "Super+f"
action = "fullscreen"

[[keybind]]
keys = "Mod+%d"
action = "workspace"
args = "%d"

[[keybind]]
keys = "Super+z"
action = "float"

[[keybind]]
keys = "Super+r"
action = "reload"

[[keybind]]
keys = "Super+Up"
action = "level-offset"
args = "1"

[[keybind]]
keys = "Super+Down"
action = "level-offset"
args = "-1"

[[keybind]]
keys = "Super+Home"
action = "level"
args = "0"

[[keybind]]
keys = "Super+End"
action = "level"
args = "9"

[[keybind]]
keys = "Super+1"
action = "workspace"
args = "1"

