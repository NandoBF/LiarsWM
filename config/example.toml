[general]


[general.appearance]
inner_gaps = 3
outer_gaps = 5
border_width = 5

[[keybind]]
keys = "Ctrl+Return"
action = "spawn"
args = "kitty"

[[keybind]]
keys = "Ctrl+Shift+C"
action = "close"

[[keybind]]
keys = "Ctrl+Shift+Space"
action = "spawn"
args = "rofi -show drun"

[[keybind]]
keys = "Ctrl+f"
action = "fullscreen"

[[keybind]]
keys = "Mod+%d"
action = "workspace"
args = "%d"

[[keybind]]
keys = "Ctrl+Alt+2"
action = "workspacesend"
args = "2"

[[keybind]]
keys = "Ctrl+z"
action = "float"

[[keybind]]
keys = "Ctrl+r"
action = "reload"

[[keybind]]
keys = "Ctrl+Space"
action = "spawn"
args = "fuzzel -d --anchor bottom-left --y-margin 5 --x-margin 5 -l 0 | xargs -I {} /home/nabattis/Documents/Projects/liarswm/build/liarsctl workspace {}"

[[keybind]]
keys = "Ctrl+Alt+Space"
action = "spawn"
args = "fuzzel -d --anchor bottom-left --y-margin 5 --x-margin 5 -l 0 | xargs -I {} /home/nabattis/Documents/Projects/liarswm/build/liarsctl workspacesend {}"
