[general]


[general.appearance]
inner_gaps = 3
outer_gaps = 5
border_width = 5

[[keybind]]
keys = "Ctrl+Return"
action = "spawn"
args = "kitty"

[[keybind]]
keys = "Ctrl+Shift+C"
action = "close"

[[keybind]]
keys = "Ctrl+Shift+F"
action = "spawn"
args = "firefox"

[[keybind]]
keys = "Mod+Shit+C"
action = "close"

[[keybind]]
keys = "Mod+%d"
action = "workspace"
args = "%d"


[[keybind]]
keys = "Ctrl+1"
action = "workspace"
args = "1"

[[keybind]]
keys = "Ctrl+2"
action = "workspace"
args = "2"

[[keybind]]
keys = "Ctrl+Alt+2"
action = "workspacesend"
args = "2"

