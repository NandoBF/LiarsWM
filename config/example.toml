[general]


[general.appearance]
inner_gaps = 3
outer_gaps = 5
border_width = 5

[[keybind]]
keys = "Super+Return"
action = "spawn"
args = "kitty"

[[keybind]]
keys = "Super+Shift+C"
action = "close"

[[keybind]]
keys = "Super+Shift+Space"
action = "spawn"
args = "rofi -show drun"

[[keybind]]
keys = "Super+f"
action = "fullscreen"

[[keybind]]
keys = "Mod+%d"
action = "workspace"
args = "%d"

[[keybind]]
keys = "Super+Alt+2"
action = "workspacesend"
args = "2"

[[keybind]]
keys = "Super+z"
action = "float"

[[keybind]]
keys = "Super+r"
action = "reload"

[[keybind]]
keys = "Super+Up"
action = "level-offset"
args = "1"

[[keybind]]
keys = "Super+Down"
action = "level-offset"
args = "-1"

[[keybind]]
keys = "Super+Home"
action = "level"
args = "0"

[[keybind]]
keys = "Super+End"
action = "level"
args = "9"

[[keybind]]
keys = "Super+Space"
action = "spawn"
args = "fuzzel -d --anchor bottom-left --y-margin 5 --x-margin 5 -l 0 | xargs -I {} /home/nabattis/Documents/Projects/liarswm/build/liarsctl workspace {}"

[[keybind]]
keys = "Super+Alt+Space"
action = "spawn"
args = "fuzzel -d --anchor bottom-left --y-margin 5 --x-margin 5 -l 0 | xargs -I {} /home/nabattis/Documents/Projects/liarswm/build/liarsctl workspacesend {}"
